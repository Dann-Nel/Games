<style>
:root,[data-theme=ember]{--bg:#000;--card:#1c1c1e;--ink:#fff;--mut:#98989f;--acc:#ff4d2e;--acc-ink:#000;--bad:#ff3b30;--ok:#3ddc97;--warn:#ffb020;--expo:#ff7a00;--me:#ff2d2d;--zone:#ff3b30;--nz:#fff;--inp:#2c2c2e;--line:#3a3a3c;--btn2:#2c2c2e;--hud1:#000e;--hud0:#0000;--bar:#000d;--tiles:dark}

*{box-sizing:border-box}html,body{height:100%;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,.lbl{-webkit-user-select:none;user-select:none;touch-action:manipulation}

#bg{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 140px);z-index:650;background:var(--bad);color:#fff;font-weight:700;padding:10px;border-radius:10px;display:none;text-align:center}
.rep{margin-left:6px;opacity:.6;font-size:12px}
html:not(.lite)[data-theme=ember] .leaflet-tile-pane,html:not(.lite)[data-theme=neon] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.8) contrast(.85) saturate(.5)}
.leaflet-container{background:var(--bg)}
.meDot{animation:pls 1.8s ease-in-out infinite}.expo{animation:pls .8s ease-in-out infinite}

.tp{display:flex;gap:8px}.tp button{margin:0;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px}
.tp i{display:flex;width:100%;height:14px;border-radius:5px;overflow:hidden;outline:1px solid var(--line);outline-offset:-1px}.tp i b{flex:1}
#pv{position:fixed;right:0;top:40%;z-index:1000;width:auto;margin:0;padding:14px 6px;border-radius:10px 0 0 10px;font-size:12px;writing-mode:vertical-rl;box-shadow:0 2px 10px #0006}
#pvp{position:fixed;left:0;right:0;bottom:0;z-index:1001;background:var(--bg);color:var(--ink);padding:14px 14px calc(env(safe-area-inset-bottom) + 14px);border-top:2px solid var(--acc);display:none;max-height:75vh;overflow:auto}
#pvp .grid button{margin:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,sans-serif;transition:background .2s}
body.flash{background:var(--bad)}

button.g{background:var(--btn2);color:var(--ink)}button.d{background:var(--bad);color:#fff}button.g.on,button.on{background:var(--acc);color:var(--acc-ink);outline:0}

.lg{display:flex;flex-direction:column}

#map .leaflet-bottom{bottom:var(--barh,100px)}

#dlg h2{margin:0 0 6px;font-size:20px}#dlg p{margin:0 0 12px;color:var(--mut)}
#dlg input{font-size:28px;text-align:center;letter-spacing:.3em;margin-bottom:4px}
@keyframes fadein{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:.6}}
@media(min-width:600px){#dlg{align-items:center}#dlg .sh{border-radius:20px}}
#hostp{position:absolute;left:0;right:0;bottom:0;z-index:700;height:70%;background:var(--bg);display:none;flex-direction:column;padding:10px 10px calc(env(safe-area-inset-bottom) + 10px);border-top:2px solid var(--acc)}
#hl{flex:1;overflow:auto}
#net{position:fixed;left:0;right:0;top:0;z-index:3000;background:var(--warn);color:#000;font-weight:700;text-align:center;padding:calc(env(safe-area-inset-top) + 6px) 10px 6px;display:none;font-size:14px}
#toast{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 92px);z-index:1500;background:var(--acc);color:var(--acc-ink);font-weight:700;padding:10px;border-radius:10px;display:none;text-align:center}
#chat{position:absolute;left:0;right:0;bottom:0;z-index:700;height:55%;background:var(--bg);display:none;flex-direction:column;padding:10px 10px calc(env(safe-area-inset-bottom) + 10px);border-top:2px solid var(--acc)}
#msgs{flex:1;overflow:auto;font-size:15px}#msgs b{color:var(--acc)}
#cin{display:flex;gap:6px}#cin button{width:90px;margin:0}
.mk{border-radius:50%;border:2px solid #fff;width:14px;height:14px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.top b{font-size:18px}
.top button{width:auto;margin:0;background:none;color:var(--acc);padding:6px 4px}
.big{font-size:40px;font-weight:900;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.pill{display:inline-block;background:var(--acc);color:var(--acc-ink);font-size:12px;padding:3px 10px;border-radius:99px;font-weight:700}
.lk{width:auto!important;margin:0!important;background:none!important;color:var(--acc)!important;padding:4px 6px!important}

.set .v{display:flex;align-items:center;gap:8px;color:var(--mut);white-space:nowrap}

.step button:first-child{border-right:1px solid var(--line)}
.sw{width:50px;height:30px;border-radius:99px;background:var(--btn2);position:relative;padding:0;margin:0}

.h3{margin:16px 4px 6px;color:var(--mut);font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.rdy{color:var(--acc);font-weight:700}.nrdy{color:var(--mut)}
details summary{cursor:pointer;color:var(--mut);padding:6px 0}
.lbl{background:#000a;color:#fff;border:0;border-radius:4px;font-size:11px;padding:1px 4px}
</style></head><body>
<div id="home" class="pg"></div>
<div id="toast"></div><div id="net">Connection lost. Reconnecting... (your game is safe)</div>

<div id="game">
  <div id="map"></div>
  <div id="hud"><div class="a"><span id="hrole"></span><span id="hcount"></span></div><div class="b" id="hclock"></div><div class="c" id="hsub"></div></div>
  <div id="bg">Scurry was in the background, so your location stopped updating. Keep the app open with the screen on.</div>
  <div id="chat"><div id="msgs"></div><div id="cin"><input id="ctext" maxlength="200" placeholder="Team message"><button id="csend">Send</button></div><button class="g" id="cclose">Close</button></div>
  <div id="hostp"><b>Host controls</b><p class="s" style="margin:4px 0 8px">Roles are hidden from you so hosting stays fair.</p><div id="hl"></div><button class="d" id="hend">End game now</button><button class="g" id="hclose">Close</button></div>
  <div id="bar">
    <div id="prim"><button class="d" id="bcaught">I've been tagged</button><button id="buse" style="display:none">Use</button><button id="bover" style="display:none"></button></div>
    <div id="tools"><button class="g t" id="bchat"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4V5z"/></svg><span>Chat</span></button><button class="g t" id="bvoice"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span>Voice</span></button><button class="g t" id="bmore"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>More</span></button><button class="t sos" id="bsos"><svg viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17v.5"/></svg><span>SOS</span></button></div>
  </div>
  <div id="more"><b class="hd">Menu</b><div id="mbody"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha384-NElt3Op+9NBMCYaef5HxeJmU4Xeard/Lku8ek6hoPTvYkQPh3zLIrJP7KiRocsxO" crossorigin="anonymous"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sosList=[];
let cfgCache=null,ws,S=null,token=null,code=null,me=null,map,L_=window.L,layers={},myPos=null,wake=null,audioCtx,lkRoom,micOn=false,cfgDraft={};
const cid=(()=>{try{let c=localStorage.getItem('sc_cid');if(!c){c=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('sc_cid',c)}return c}catch(e){return null}})();
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

// ---------- connection ----------
let retry=0,netTimer=null;
function netBanner(on){const el=$('#net');if(!el)return;if(on){if(!netTimer)netTimer=setTimeout(()=>{el.style.display='block'},2500)}else{clearTimeout(netTimer);netTimer=null;el.style.display='none'}}
function connect(then){
  if(ws&&(ws.readyState===0||ws.readyState===1)&&!then)return;
  ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host);
  ws.onopen=()=>{retry=0;netBanner(false);const t=store.get('sc_token'),c=store.get('sc_code');if(t&&c&&!then)send({t:'resume',code:c,token:t});else if(then)then();else render();};
  ws.onmessage=e=>onMsg(JSON.parse(e.data));
  ws.onclose=()=>{netBanner(true);setTimeout(()=>connect(),Math.min(8000,1000*Math.pow(1.6,retry++)))};
  ws.onerror=()=>{try{ws.close()}catch(e){}};
}
addEventListener('online',()=>connect());
const send=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));
function onMsg(m){
  if(m.t==='joined'){token=m.token;code=m.code;me=m.id;store.set('sc_token',token);store.set('sc_code',code);}
  else if(m.t==='gone'){store.set('sc_token','');S=null;render();}
  else if(m.t==='state'){if(m.cfg)cfgCache=m.cfg;else m.cfg=cfgCache;m.skew=m.now-Date.now();S=m;render();}
  else if(m.t==='event'){toast(m.text);if(['ping','hunt','warn','out','over','item'].includes(m.kind))alertUser(m.kind);}
  else if(m.t==='chat')addChat(m);
  else if(m.t==='error')toast(m.text);
  else if(m.t==='fix')freshFix();
  else if(m.t==='voice')startVoice(m);
  else if(m.t==='sos'){sosList.push(m);alertUser('warn');toast('SOS from '+m.name+(m.lat!=null?' (red marker on the map)':'')+'. Check on them!');}
  else if(m.t==='kicked'){store.set('sc_token','');store.set('sc_code','');ask.notice('Removed from game','The host removed you from this game.').then(()=>location.reload());}
}
function toast(t){const el=$('#toast');el.textContent=t;
  el.style.top=S&&S.phase!=='lobby'?'calc(env(safe-area-inset-top) + 92px)':'calc(env(safe-area-inset-top) + 12px)';
  el.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>el.style.display='none',4500);}
// In-app dialogs (bottom sheets) replace the browser's alert/confirm/prompt. Each resolves with the chosen action's value; backdrop tap or Escape = cancel.
function dlg({title,text,actions,input}){
  return new Promise(res=>{
    const old=$('#dlg');if(old){old._done(null)}
    const el=document.createElement('div');el.id='dlg';
    const sh=document.createElement('div');sh.className='sh';sh.setAttribute('role','dialog');sh.setAttribute('aria-modal','true');
    const h2=document.createElement('h2');h2.textContent=title;sh.appendChild(h2);
    if(text){const p=document.createElement('p');p.textContent=text;sh.appendChild(p)}
    let inp=null;if(input){inp=document.createElement('input');inp.placeholder=input.ph||'';inp.inputMode=input.mode||'text';inp.maxLength=input.max||40;inp.autocomplete='off';sh.appendChild(inp)}
    const cancel=actions.find(a=>a.cancel);
    let done=false;const finish=v=>{if(done)return;done=true;document.removeEventListener('keydown',onKey);el.remove();res(v)};
    el._done=finish;
    for(const a of actions){const b=document.createElement('button');b.textContent=a.l;if(a.d)b.className='d';else if(a.g)b.className='g';
      b.onclick=()=>finish(input&&!a.cancel?inp.value.trim():a.k);sh.appendChild(b)}
    const onKey=e=>{if(e.key==='Escape')finish(cancel?cancel.k:null);else if(e.key==='Enter'&&input){const ok=actions.find(a=>!a.cancel);if(ok)finish(inp.value.trim())}};
    document.addEventListener('keydown',onKey);
    el.onclick=e=>{if(e.target===el)finish(cancel?cancel.k:null)};
    el.appendChild(sh);document.body.appendChild(el);(inp||sh.querySelector('button:last-child')).focus();
  });
}
const ask={
  confirm:(title,text,o={})=>dlg({title,text,actions:[{k:true,l:o.ok||'OK',d:o.danger},{k:false,l:o.cancel||'Cancel',g:1,cancel:1}]}),
  notice:(title,text,ok='OK')=>dlg({title,text,actions:[{k:true,l:ok,cancel:1}]}),
  choose:(title,text,opts)=>dlg({title,text,actions:[...opts.map(o=>({k:o.k,l:o.l,g:1})),{k:null,l:'Cancel',cancel:1}]}),
  code:(title,text)=>dlg({title,text,input:{ph:'0000',mode:'numeric',max:4},actions:[{k:'ok',l:'Submit'},{k:null,l:'Cancel',g:1,cancel:1}]})
};
const voiceUI=(label,live)=>{$('#bvoice span').textContent=label;$('#bvoice').classList.toggle('live',!!live)};
function beep(f){try{audioCtx=audioCtx||new AudioContext();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=f;o.connect(g);g.connect(audioCtx.destination);g.gain.value=.3;o.start();o.stop(audioCtx.currentTime+.3)}catch(e){}}
function alertUser(k){beep({ping:740,hunt:1000,warn:300,out:400,over:520}[k]||800);navigator.vibrate&&navigator.vibrate([200,100,200]);document.body.classList.add('flash');setTimeout(()=>document.body.classList.remove('flash'),400);}

// ---------- geolocation ----------
function watchGPS(){
  if(watchGPS.id||!navigator.geolocation)return;
  const low=!!watchGPS.low;
  watchGPS.id=navigator.geolocation.watchPosition(p=>{myPos={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};send({t:'loc',lat:myPos.lat,lng:myPos.lng,acc:myPos.acc});},
    e=>{
      if(e.code===3&&!watchGPS.low){watchGPS.low=true;navigator.geolocation.clearWatch(watchGPS.id);watchGPS.id=null;watchGPS();return}   // timeout: retry with network/Wi-Fi positioning
      if(Date.now()-(watchGPS.lastErr||0)>30000){watchGPS.lastErr=Date.now();toast(e.code===1?'Location is blocked. Allow it in your browser settings.':'GPS signal weak. Move to open sky.')}
    },low?{enableHighAccuracy:false,maximumAge:10000,timeout:30000}:{enableHighAccuracy:true,maximumAge:2000,timeout:20000});
}
// The server asks for this a few seconds before every ping so the revealed dot is as fresh and precise as possible.
function freshFix(){if(!navigator.geolocation)return;
  navigator.geolocation.getCurrentPosition(p=>{myPos={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};send({t:'loc',lat:myPos.lat,lng:myPos.lng,acc:myPos.acc})},()=>{},{enableHighAccuracy:true,maximumAge:3000,timeout:6000})}
function stopGPS(){if(watchGPS.id){navigator.geolocation.clearWatch(watchGPS.id);watchGPS.id=null}myPos=null}
async function keepAwake(){try{wake=await navigator.wakeLock.request('screen')}catch(e){}}
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();return}
  if(!PREVIEW&&(!ws||ws.readyState>1))connect();
  if(S&&S.phase!=='lobby'){keepAwake();freshFix();
    if(S.phase!=='over'&&hiddenAt&&Date.now()-hiddenAt>8000){const b=$('#bg');b.style.display='block';setTimeout(()=>b.style.display='none',6000)}}
  hiddenAt=0;
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

// ---------- screens ----------
function render(){
  if(lobbyMap&&(!S||S.phase!=='lobby')){lobbyMap.remove();lobbyMap=null;lobby.zm=null}

  for(const m of S.markers){
    const age=Math.round((now-m.t)/1000),key=m.id+(m.kind==='watch'?'w':''),live=m.kind!=='ally'&&m.kind!=='watch';
    const col=m.kind==='watch'?(m.role==='hunter'?T('--bad'):T('--ok')):{ally:T('--ok'),ping:T('--warn'),exposed:T('--expo')}[m.kind];
    const op=m.kind==='ping'?Math.round(Math.max(.35,1-age/(S.cfg.pingEvery*2))*20)/20:1;
    const txt=m.kind==='ally'||m.kind==='watch'?esc(m.name):`${esc(m.name)} · ${m.kind==='ping'?'last ping '+age+'s ago':'EXPOSED live'}${m.acc?' ±'+m.acc+'m':''}`;
    seen.add(key);
    let e=mkc.get(key);
    if(!e||e.kind!==m.kind){
      if(e){layers.mk.removeLayer(e.c);if(e.r)layers.mk.removeLayer(e.r)}
      e={kind:m.kind,r:null,ring:0,pos:'',col:'',op:-1,txt:''};
      e.c=L_.circleMarker([m.lat,m.lng],{radius:m.kind==='ally'||m.kind==='watch'?6:9,color:'#fff',weight:2,fillColor:col,fillOpacity:op,className:m.kind==='exposed'?'expo':'',renderer:m.kind==='exposed'?svgR:undefined}).addTo(layers.mk);
      e.c.bindTooltip(txt,{permanent:live,direction:'top',className:'lbl'});e.txt=txt;mkc.set(key,e);
    }
    const pos=m.lat+','+m.lng;
    if(pos!==e.pos){e.pos=pos;e.c.setLatLng([m.lat,m.lng])}
    if(col!==e.col||op!==e.op){e.col=col;e.op=op;e.c.setStyle({fillColor:col,fillOpacity:op})}
    if(txt!==e.txt){e.txt=txt;e.c.setTooltipContent(txt)}
    const ring=m.acc>8?m.acc:0;                                        // accuracy ring
    if(ring&&!e.r){e.r=L_.circle([m.lat,m.lng],{radius:ring,color:col,weight:1,fillOpacity:.08,interactive:false}).addTo(layers.mk)}
    else if(!ring&&e.r){layers.mk.removeLayer(e.r);e.r=null}
    else if(e.r){if(pos!==e.rpos)e.r.setLatLng([m.lat,m.lng]);if(ring!==e.ring)e.r.setRadius(ring);e.r.setStyle({color:col})}
    e.rpos=pos;e.ring=ring;
  }
  for(const[k,e]of mkc)if(!seen.has(k)){layers.mk.removeLayer(e.c);if(e.r)layers.mk.removeLayer(e.r);mkc.delete(k)}
  const role=y.out?(y.role==='hunter'?'HUNTER (caught)':'SPECTATOR'):y.role.toUpperCase();
  $('#hrole').textContent=role;const rc=y.role==='hunter'?'var(--bad)':y.role==='runner'&&!y.out?'var(--ok)':'var(--mut)';$('#hud').style.setProperty('--rolec',rc);$('#hrole').style.color=rc;$('#hcount').textContent=`${S.counts.runners} runners · ${S.counts.hunters} hunters`;
  if(S.phase==='over'){
    $('#hclock').textContent={hunters:'Hunters win',runners:'Runners win',none:'Game ended by host'}[S.winner]||'Game over';$('#hsub').textContent='';
  }else if(S.phase==='hide'){
    $('#hclock').textContent=fmt(S.huntStart-now);$('#hsub').textContent=y.role==='runner'?'Hide! Hunters are frozen.':'Hunters wait: runners are hiding.';
  }else{
    $('#hclock').textContent=z.next&&S.cfg.zoneOn?fmt(z.until-now):fmt(S.huntEnd-now);
    let s=!S.cfg.zoneOn?'No play zone':z.next?(z.shrinking?'Zone is shrinking now':`Zone shrinks in ${fmt(z.until-now)}`):'Final zone';
    s+=` · next ping ${fmt(S.nextPingAt-now)}`;
    if(y.role==='spectator')s=`Watching ${S.cfg.watchDelay}s behind live · next ping ${fmt(S.nextPingAt-now)}`;
    if(y.safe)s='SAFE SPOT: can\'t be tagged. Shelter left '+Math.round(y.safeLeft)+'s';
    if(y.outsideSince)s='OUTSIDE ZONE: hunters see you! Out in '+fmt(y.outsideSince+S.cfg.outsideGrace*1000-now);
    if(y.stale)s='NO GPS SIGNAL ('+y.stale+'s)! '+s;
    $('#hsub').textContent=s;
  }
  const mute=y.role==='hunter'&&S.cfg.huntersTalk===false;
  $('#bvoice').style.display=S.cfg.voice&&!mute?'':'none';$('#bchat').style.display=S.cfg.teamChat&&!mute?'':'none';
  hostPanel();
  const bu=$('#buse'),bc=$('#bcaught'),bo=$('#bover');
  bu.style.display=(y.item&&S.phase==='hunt')?'':'none';
  bu.textContent='Use '+({decoy:'Decoy',ghost:'Ghost',radar:'Radar'}[y.item]||'');
  bc.style.display=(y.role==='runner'&&!y.out&&S.phase!=='over')?'':'none';
  bo.style.display=S.phase==='over'?'':'none';bo.textContent=S.host?'Rematch':'Game over';bo.className=S.host?'':'g';bo.onclick=()=>S.host&&send({t:'rematch'});
  $('#prim').style.display=[bu,bc,bo].some(x=>x.style.display!=='none')?'flex':'none';
  $('#bsos').style.display=S.phase==='over'?'none':'';
  document.documentElement.style.setProperty('--barh',$('#bar').offsetHeight+'px');   // keep the map credit above the bar
  moreSheet();
}
// "More" sheet: backup tag code, manual code entry, host controls, theme.
function moreSheet(open){
  const el=$('#more');if(open)el.style.display='flex';
  if(el.style.display!=='flex'||!S||!S.you)return;
  const y=S.you,sig=JSON.stringify([y.role,y.out,y.tagCode,S.host,S.phase,document.documentElement.dataset.theme,isLite()]);
  if(!open&&sig===moreSheet.sig)return;moreSheet.sig=sig;
  let b='';
  if(y.role==='runner'&&!y.out&&S.phase!=='over')b+=`<div class="card"><label style="margin:0">Backup code</label><div class="big">${esc(y.tagCode||'')}</div><p class="s" style="margin:4px 0 0">Only if a hunter tagged you and the app did not register it: tell them this code. Normally just use the red button.</p></div>`;
  if(y.role==='hunter'&&S.phase==='hunt')b+='<button class="g" id="mcode">Enter a runner\'s code</button>';
  if(S.host)b+='<button class="g" id="mhost">Host controls</button>';
  b+=`<div class="h3">Theme</div>${themePicker()}<div class="set" style="margin-top:8px"><span>Smooth mode<small>Easier on battery and older phones. Turn off for a fancier dark map.</small></span><button class="sw ${isLite()?'on':''}" id="mlite" aria-label="Smooth mode"></button></div><button class="g" id="mclose">Close</button>`;
  $('#mbody').innerHTML=b;wireThemes();
  $('#mclose').onclick=()=>{el.style.display='none'};
  $('#mlite').onclick=()=>{store.set('sc_lite',isLite()?'0':'1');applyLite();moreSheet(true)};
  if($('#mhost'))$('#mhost').onclick=()=>{el.style.display='none';hostPanel(true)};
  if($('#mcode'))$('#mcode').onclick=async()=>{const c=await ask.code('Runner\'s code','Only if a runner you tagged will not report it: enter their 4-digit code.');if(c){el.style.display='none';send({t:'tag',code:c})}};
}

// ---------- chat + voice ----------
const chatLog=[];
function addChat(m){chatLog.push(m);const box=$('#msgs');box.insertAdjacentHTML('beforeend',`<div><b>${esc(m.from)}</b> ${esc(m.text)}${m.fid&&m.fid!==(S&&S.you.id)?` <a class="rep" data-rep="${esc(m.fid)}" data-nm="${esc(m.from)}">report</a>`:''}</div>`);box.scrollTop=box.scrollHeight;
  if($('#chat').style.display!=='flex')$('#bchat').classList.add('dot');}
$('#buse').onclick=()=>send({t:'use'});
$('#bsos').onclick=async()=>{if(await ask.confirm('Send an SOS?','The host and players near you will see your location. Only use this if you need help.',{ok:'Send SOS',danger:true}))send({t:'sos'})};
$('#bmore').onclick=()=>moreSheet(true);
$('#hclose').onclick=()=>{$('#hostp').style.display='none'};
$('#hend').onclick=async()=>{if(await ask.confirm('End the game for everyone?','Everyone is told the host ended it.',{ok:'End game',danger:true}))send({t:'end'})};
function hostPanel(open){
  const el=$('#hostp');if(open)el.style.display='flex';
  if(el.style.display!=='flex'||!S||!S.roster)return;
  const sig=JSON.stringify([S.roster,S.reports]);if(!open&&sig===hostPanel.sig)return;hostPanel.sig=sig;
  $('#hl').innerHTML=S.roster.filter(r=>r.id!==S.you.id).map(r=>`<div class="row"><span>${esc(r.name)}${r.online?'':' (offline)'}${r.stale?' · no GPS '+r.stale+'s':''}${r.flags?' · flagged x'+r.flags:''}${r.reports?' · reported x'+r.reports:''}</span><span><button class="g" data-mute="${r.id}" data-on="${r.muted?0:1}">${r.muted?'Unmute':'Mute'}</button> <button class="d" data-kick="${r.id}">Kick</button></span></div>`).join('')||'<p class="s">No other players.</p>';
  if(S.reports&&S.reports.length)$('#hl').insertAdjacentHTML('afterbegin','<div class="card"><b>Reports</b>'+S.reports.slice(-8).reverse().map(x=>`<div class="row"><span>${esc(x.aboutName)} · ${x.reason}</span><span class="s" style="margin:0">by ${esc(x.byName)}</span></div>`).join('')+'</div>');
  document.querySelectorAll('#hl [data-mute]').forEach(b=>b.onclick=()=>send({t:'mute',id:b.dataset.mute,on:b.dataset.on==='1'}));
  document.querySelectorAll('#hl [data-kick]').forEach(b=>b.onclick=async()=>{if(await ask.confirm('Remove this player?','They will not be able to rejoin this game.',{ok:'Remove',danger:true}))send({t:'kick',id:b.dataset.kick})});
}
$('#bcaught').onclick=async()=>{if(await ask.confirm('Were you tagged?','You will be out of the game.',{ok:"Yes, I'm out",danger:true}))send({t:'caught'})};
$('#bchat').onclick=()=>{$('#chat').style.display='flex';$('#bchat').classList.remove('dot');$('#msgs').scrollTop=1e9};
$('#msgs').onclick=async e=>{const a=e.target.closest('[data-rep]');if(!a)return;
  const reason=await ask.choose('Report '+a.dataset.nm,'What happened? The host will see your report.',[{k:'abuse',l:'Abuse or harassment'},{k:'cheating',l:'Cheating'},{k:'unsafe',l:'Unsafe behaviour'},{k:'other',l:'Something else'}]);
  if(reason)send({t:'report',id:a.dataset.rep,reason})};
$('#cclose').onclick=()=>$('#chat').style.display='none';
const sendChat=()=>{const t=$('#ctext').value.trim();if(t){send({t:'chat',text:t});$('#ctext').value=''}};
$('#csend').onclick=sendChat;$('#ctext').onkeydown=e=>{if(e.key==='Enter')sendChat()};
$('#bvoice').onclick=async()=>{
  if(lkRoom){micOn=!micOn;await lkRoom.localParticipant.setMicrophoneEnabled(micOn);voiceUI(micOn?'Mic on':'Mic off',micOn);return}
  send({t:'voice'});
};
async function startVoice(v){
  try{
    if(!window.LivekitClient)await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/livekit-client@2.5.0/dist/livekit-client.umd.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});
    const LK=window.LivekitClient;lkRoom=new LK.Room();
    lkRoom.on(LK.RoomEvent.TrackSubscribed,t=>{if(t.kind==='audio'){const a=t.attach();a.style.display='none';document.body.appendChild(a)}});
    await lkRoom.connect(v.url,v.token);await lkRoom.localParticipant.setMicrophoneEnabled(true);micOn=true;voiceUI('Mic on',true);
  }catch(e){lkRoom=null;toast('Voice failed: '+(e.message||e))}
}
setInterval(()=>{if(S&&S.phase!=='lobby'&&!$('#game').hidden&&!document.hidden)game()},1000);

// ---------- preview mode: /?preview shows every screen with sample data, no server or GPS needed ----------
const PREVIEW=/[?&]preview\b/.test(location.search);
function mockState(kind){
  const now=Date.now(),c={lat:51.5074,lng:-0.1278},o=(n,e)=>({lat:c.lat+n/111320,lng:c.lng+e/(111320*Math.cos(c.lat*Math.PI/180))});
  const cfg={hunterRatio:.15,hideSecs:180,radius:600,stages:5,stageFactor:.7,hold:240,shrink:60,pingEvery:120,huntSecs:1800,outsideGrace:30,tagRange:25,taggedMode:'watch',caughtJoinHunters:false,teamChat:true,voice:true,huntersTalk:true,pingRevealsHunters:false,safeSecs:60,safeRadius:20,bounty:false,bountyAt:3,bountyEvery:20,drops:true,dropEvery:120,radarRadius:150,gpsStaleWarn:30,gpsStaleOut:120,maxAccuracy:50,maxSpeed:15,sosRadius:300,watchDelay:60,zoneOn:true};
  const names=['Maya','Jonas','Priya','Theo','Zane','Lena'];
  if(kind==='lobby-host'||kind==='lobby-guest'){
    const host=kind==='lobby-host';
    return {t:'state',now,code:'PLHN',phase:'lobby',cfg,host,center:null,spots:[],drops:[],
      you:{id:'me',name:'Rufaro',role:null,out:false,pref:'random',exposed:false,item:null,safe:false,safeLeft:60,stale:0,muted:false},
      players:[{id:'me',name:'Rufaro',pref:'random',online:true,ready:host,host},{id:'a',name:'Maya',pref:'hunter',online:true,ready:true,host:!host},{id:'b',name:'Jonas',pref:'runner',online:true,ready:true,host:false},{id:'c',name:'Priya',pref:'random',online:true,ready:false,host:false}]};
  }
  const role=kind==='hunter'?'hunter':kind==='spectator'?'spectator':'runner';
  const s={t:'state',now,code:'PLHN',phase:kind==='over'?'over':'hunt',cfg,host:kind==='runner',center:c,winner:kind==='over'?'runners':null,
    you:{id:'me',name:'Rufaro',role:kind==='over'?'runner':role,out:role==='spectator',pref:'random',exposed:false,tagCode:role==='runner'?'4827':undefined,item:role==='runner'?'decoy':role==='hunter'?'radar':null,safe:false,safeLeft:42,stale:0,muted:false},
    spots:[{...o(-120,160)},{...o(180,-140)}],drops:[{id:1,...o(90,60),expires:now+110000}],
    counts:{runners:9,hunters:3,total:12},huntStart:now-420000,huntEnd:now+1380000,nextPingAt:now+47000,
    zone:{cur:{...c,r:540},next:{...o(40,-30),r:380},shrinking:false,until:now+95000,stage:1},roster:[],markers:[]};
  if(role==='runner')s.markers=[{id:'a',name:names[0],kind:'ally',...o(60,-80),t:now,acc:6},{id:'b',name:names[1],kind:'ally',...o(-70,-30),t:now,acc:9},{id:'c',name:names[2],kind:'ally',...o(140,110),t:now,acc:7}];
  if(role==='hunter')s.markers=[{id:'a',name:names[3],kind:'ally',...o(-40,50),t:now,acc:5},{id:'b',name:names[4],kind:'ally',...o(150,-90),t:now,acc:8},
    {id:'c',name:names[0],kind:'ping',...o(60,-80),t:now-33000,acc:14},{id:'d',name:names[1],kind:'ping',...o(-110,-20),t:now-71000,acc:20},{id:'e',name:names[5],kind:'exposed',...o(300,210),t:now,acc:6}];
  if(role==='spectator')s.markers=[{id:'a',name:names[3],kind:'watch',role:'hunter',...o(-40,50),t:now-60000,acc:5},{id:'c',name:names[0],kind:'watch',role:'runner',...o(60,-80),t:now-60000,acc:6},{id:'d',name:names[1],kind:'watch',role:'runner',...o(-110,-20),t:now-60000,acc:9}];
  if(kind==='over')s.markers=[];
  return s;
}
function startPreview(){
  watchGPS=()=>{};freshFix=()=>{};                          // no GPS prompts in preview
  myPos={lat:51.5074-20/111320,lng:-0.1278+25/69000,acc:12};
  const SCREENS=[['home','Home'],['lobby-host','Lobby (host)'],['lobby-guest','Lobby (guest)'],['runner','Runner'],['hunter','Hunter'],['spectator','Tagged: watching'],['over','Game over']];
  let cur='runner';
  const show=k=>{cur=k;$('#home').dataset.mode='';lobby.sig=null;S=k==='home'?null:mockState(k);render();panel()};
  const panel=()=>{$('#pvp').innerHTML=`<b>Preview</b><p class="s" style="margin:2px 0 8px">Sample data only. Nothing is sent to a server.</p>
    <div class="h3" style="margin-top:0">Screen</div><div class="grid">${SCREENS.map(([k,l])=>`<button class="${cur===k?'':'g'}" data-pvs="${k}">${l}</button>`).join('')}</div>
    <div class="h3">Theme</div>${themePicker()}
    <div class="h3">Try it</div><div class="grid"><button class="g" id="pvt">Show alert</button><button class="g" id="pvd">Try SOS dialog</button><button class="g" id="pvr">Try report dialog</button><button class="g" id="pvm">Open menu</button><button class="g" id="pvh">Hide panel</button></div>`;
    document.querySelectorAll('[data-pvs]').forEach(b=>b.onclick=()=>show(b.dataset.pvs));wireThemes();
    $('#pvt').onclick=()=>{toast('PING! Runner positions revealed to hunters.',true);alertUser('ping')};$('#pvh').onclick=()=>{$('#pvp').style.display='none'};
    $('#pvd').onclick=()=>{$('#pvp').style.display='none';ask.confirm('Send an SOS?','The host and players near you will see your location. Only use this if you need help.',{ok:'Send SOS',danger:true})};
    $('#pvr').onclick=()=>{$('#pvp').style.display='none';ask.choose('Report Maya','What happened? The host will see your report.',[{k:'abuse',l:'Abuse or harassment'},{k:'cheating',l:'Cheating'},{k:'unsafe',l:'Unsafe behaviour'},{k:'other',l:'Something else'}])};
    $('#pvm').onclick=()=>{$('#pvp').style.display='none';moreSheet(true)}};
  const _set=setTheme;setTheme=t=>{_set(t);panel()};
  document.body.insertAdjacentHTML('beforeend','<button id="pv">Preview</button><div id="pvp"></div>');
  $('#pv').onclick=()=>{const p=$('#pvp');p.style.display=p.style.display==='block'?'none':'block'};
  show('runner');$('#pvp').style.display='block';
}
if(PREVIEW)startPreview();else connect();
