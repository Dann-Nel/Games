# Fly.io config for Scurry Live. Johannesburg is the closest region to South Africa.
# Games live in the server's memory, so run exactly ONE machine (two would split players into separate servers).
primary_region = "jnb"

[build]

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"      # never sleep: a sleeping machine would wipe a running game
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250
  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
